<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Giftrav — Where Every Gift Becomes a Memory</title>
<meta name="description" content="Giftrav. Where every gift becomes a memory. Launching across Australia, late 2026.">
<meta name="theme-color" content="#201e1d">

<!-- Social sharing. Absolute URLs pointing at the custom domain (see the CNAME
     file at the repo root). If the domain ever changes, these four and the
     canonical link must change with it - relative paths will not work here. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Giftrav">
<meta property="og:title" content="Giftrav — Where Every Gift Becomes a Memory">
<meta property="og:description" content="Launching across Australia, late 2026.">
<meta property="og:image" content="https://giftrav.com/media/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sunrise over misty mountain ranges, with the Giftrav wordmark.">
<meta property="og:url" content="https://giftrav.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Giftrav — Where Every Gift Becomes a Memory">
<meta name="twitter:description" content="Launching across Australia, late 2026.">
<meta name="twitter:image" content="https://giftrav.com/media/og-image.jpg">

<link rel="canonical" href="https://giftrav.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preload" href="fonts/source-serif-4-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ds/broadsheet/styles.css">

<style>
  /* Source Serif 4, self-hosted. The design system's stylesheet used to
     @import this from Google Fonts, which is render-blocking and adds a
     third-party round trip for a font we can ship in 42 KB. */
  @font-face {
    font-family: "Source Serif 4";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("fonts/source-serif-4-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Source Serif 4";
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url("fonts/source-serif-4-latin-600-normal.woff2") format("woff2");
  }

  /* ---------------------------------------------------------------
     Giftrav — coming soon
     Tokens come from the Broadsheet design system (ds/broadsheet/styles.css).
     Only the values that must differ on a dark, photographic page are
     redeclared here.
     --------------------------------------------------------------- */
  :root {
    --ink:        #14100e;              /* scrim base — warmer than pure black, sits under the sunrise */
    --paper:      #f4f2ef;              /* body text on the dark field */
    --accent:     var(--color-process-yellow, #edbb00);  /* press yellow, the system's warm spot colour */
    --gutter:     clamp(22px, 5vw, 76px);
    /* How far the plate behind the copy fades in. A fixed length, not a
       percentage, so it is at full density by the time it reaches the
       kicker on any screen height. */
    --fade:       clamp(60px, 10vh, 150px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-text, #201e1d);
    color: var(--paper);
    font-family: var(--font-body, "Source Serif 4", Georgia, serif);
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--paper); }

  /* Visible focus ring — the DS default is tuned for light backgrounds. */
  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .skip {
    position: absolute; left: -9999px; top: 0;
    background: var(--accent); color: var(--color-text, #201e1d);
    padding: 10px 16px; z-index: 10; text-decoration: none;
  }
  .skip:focus { left: 8px; top: 8px; }

  /* ---------------------------------------------------------------
     Stage
     The video is a full-bleed background at every size, with all type
     overlaid on top of it. Legibility comes from two gradient plates
     attached to the text blocks themselves (.masthead and .lede) plus
     a shadow on the glyphs — not from a viewport-height gradient,
     which drifts out from under the copy on short screens.
     --------------------------------------------------------------- */
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100svh;
    overflow: hidden;
    background: var(--color-text, #201e1d);
  }

  .masthead {
    position: relative;
    z-index: 2;
    padding: clamp(18px, 3.4vh, 30px) var(--gutter) clamp(30px, 5vh, 60px);
    /* Plate sized by the masthead, not the window. */
    background: linear-gradient(to bottom,
      rgba(20,16,14,0.62) 0%,
      rgba(20,16,14,0.52) 46%,
      rgba(20,16,14,0.26) 74%,
      rgba(20,16,14,0.00) 100%);
  }

  .wordmark {
    display: block;
    margin: 0 0 clamp(12px, 2vh, 18px);
    font-family: var(--font-heading, "Source Serif 4", Georgia, serif);
    font-weight: var(--font-heading-weight, 600);
    font-size: clamp(21px, 2.4vw, 30px);
    line-height: 1;
    letter-spacing: 0.03em;
    color: var(--paper);
    text-shadow: 0 1px 3px rgba(20,16,14,0.55), 0 2px 22px rgba(20,16,14,0.75);
  }

  /* Broadsheet's front-page furniture: the one place the system prints a rule. */
  .rule-head {
    height: 5px;
    margin: 0;
    border: 0;
    border-top: 2px solid var(--accent);
    border-bottom: 1px solid var(--accent);
    opacity: 0.9;
  }

  /* ---- background video ------------------------------------------ */
  .media {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: var(--ink) url("media/poster.jpg") center/cover no-repeat;
  }

  .bgvideo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    /* A light warm grade, plus a small overall brightness cut so the
       image sits behind the type rather than competing with it.
       No sepia, no hue-rotate: the old wash removed the reason for
       using this footage in the first place. */
    filter: saturate(1.08) contrast(1.02) brightness(0.88);
  }

  /* An even veil over the whole frame — keeps the picture fully visible
     while lifting every part of it away from white text. */
  .scrim {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: rgba(20,16,14,0.20);
  }

  /* ---- type ------------------------------------------------------ */
  main {
    position: relative;
    z-index: 2;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;   /* copy anchors to the bottom at every size */
  }

  /* Plate under the copy. Fades in over a fixed distance, so it is at
     full density where the kicker starts whatever the screen height. */
  .lede {
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2.2vh, 22px);
    padding: var(--fade) var(--gutter) clamp(18px, 2.6vh, 36px);
    background: linear-gradient(to bottom,
      rgba(20,16,14,0.00) 0,
      rgba(20,16,14,0.26) calc(var(--fade) * 0.42),
      rgba(20,16,14,0.56) calc(var(--fade) * 0.78),
      rgba(20,16,14,0.66) var(--fade),
      rgba(20,16,14,0.70) 100%);
  }

  .kicker {
    margin: 0;
    font-size: clamp(12px, 1.05vw, 14px);
    line-height: 1.2;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 1px 2px rgba(20,16,14,0.7), 0 1px 14px rgba(20,16,14,0.8);
  }

  .display {
    margin: 0;
    max-width: 15ch;
    font-family: var(--font-heading, "Source Serif 4", Georgia, serif);
    font-weight: var(--font-heading-weight, 600);
    font-size: clamp(38px, 7.6vw, 92px);
    line-height: 1.04;
    letter-spacing: -0.02em;
    text-wrap: balance;
    color: var(--paper);
    text-shadow: 0 1px 3px rgba(20,16,14,0.45), 0 3px 30px rgba(20,16,14,0.7);
  }

  .display .accent { color: var(--accent); }

  /* The line break is a hint, not a rule: it only applies once there is
     room for it. Below that the headline wraps naturally instead of
     stranding "Memory" on a line by itself. */
  .display .brk { display: none; }
  .display .brk br { line-height: inherit; }

  .sub {
    margin: 0;
    max-width: 44ch;
    font-size: clamp(15px, 1.25vw, 19px);
    line-height: 1.55;
    color: color-mix(in srgb, var(--paper) 82%, transparent);
    text-shadow: 0 1px 2px rgba(20,16,14,0.7), 0 1px 14px rgba(20,16,14,0.8);
  }

  /* ---- footer ---------------------------------------------------- */
  footer {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 24px;
    padding: clamp(16px, 2.4vh, 26px) var(--gutter)
             calc(clamp(16px, 2.4vh, 26px) + env(safe-area-inset-bottom, 0px));
    font-size: 13px;
    letter-spacing: 0.02em;
    color: color-mix(in srgb, var(--paper) 72%, transparent);
    background: rgba(20,16,14,0.70);
    text-shadow: 0 1px 2px rgba(20,16,14,0.7);
  }

  .socials {
    display: flex;
    align-items: center;
    gap: clamp(14px, 2vw, 26px);
  }

  .socials a {
    color: color-mix(in srgb, var(--paper) 88%, transparent);
    text-decoration: none;
    padding: 6px 0;
  }
  .socials a:hover { color: var(--accent); }

  /* Motion control — WCAG 2.2.2. Anything that autoplays and runs past
     five seconds needs a way to stop it. */
  .motion-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    background: rgba(244,242,239,0.06);
    border: 1px solid rgba(244,242,239,0.34);
    border-radius: 50%;
    color: var(--paper);
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease;
  }
  .motion-toggle:hover {
    background: rgba(244,242,239,0.14);
    border-color: rgba(244,242,239,0.6);
  }
  .motion-toggle svg { width: 13px; height: 13px; fill: currentColor; }
  .motion-toggle .i-play  { display: none; }
  .motion-toggle[aria-pressed="true"] .i-play  { display: block; }
  .motion-toggle[aria-pressed="true"] .i-pause { display: none; }

  /* Small phones: keep the whole composition inside the viewport. */
  @media (max-aspect-ratio: 6/5) and (max-height: 700px) {
    .display  { font-size: clamp(29px, 8.2vw, 40px); }
    .sub      { font-size: 14px; }
    .lede     { gap: 10px; --fade: 52px; padding-bottom: 16px; }
    .masthead { padding-top: 14px; padding-bottom: 22px; }
  }

  /* Wide enough that the headline can hold two long lines: apply the
     hard break, and let the measure run wider. */
  @media (min-aspect-ratio: 6/5) {
    .display { max-width: 17ch; }
    .display .brk { display: inline; }
  }

  /* Wide and tall enough that the fixed break reads well and the
     headline can take the full two-line treatment. */
  @media (min-width: 900px) and (min-aspect-ratio: 6/5) {
    .display { font-size: clamp(56px, 6.4vw, 96px); }
  }

  /* Landscape phones: very little vertical room — tighten everything
     so the footer still lands inside the viewport. */
  @media (max-height: 460px) and (min-aspect-ratio: 6/5) {
    .masthead { padding-top: 14px; }
    .wordmark { font-size: 19px; margin-bottom: 9px; }
    .display  { font-size: clamp(30px, 5.4vh, 46px); max-width: 26ch; }
    .sub      { font-size: 14px; }
    .lede     { gap: 9px; --fade: 44px; padding-bottom: 10px; }
    footer    { padding-top: 10px; padding-bottom: 12px; }
  }

  /* Very large screens: stop the type sprawling across the full width. */
  @media (min-width: 1800px) {
    .stage > .masthead,
    .stage > footer,
    .lede { padding-inline: max(var(--gutter), calc((100vw - 1680px) / 2)); }
  }

  /* ---------------------------------------------------------------
     Reduced motion — the poster still carries the page.
     --------------------------------------------------------------- */
  @media (prefers-reduced-motion: reduce) {
    .bgvideo { display: none; }
    .motion-toggle { display: none; }
    * { transition: none !important; }
  }

  /* Print — the newspaper the system is named after. */
  @media print {
    .media, .scrim, .motion-toggle { display: none !important; }
    html, body, .stage { background: #fff; color: #201e1d; min-height: 0; }
    .wordmark, .display, .sub, footer { color: #201e1d; }
  }
</style>
</head>

<body>
<a class="skip" href="#content">Skip to content</a>

<div class="stage">

  <header class="masthead">
    <span class="wordmark">GIFTRAV</span>
    <hr class="rule-head">
  </header>

  <div class="media">
    <video class="bgvideo" autoplay loop muted playsinline preload="metadata"
           poster="media/poster.jpg" aria-hidden="true" tabindex="-1">
      <source src="media/giftrav-hero.webm" type="video/webm">
      <source src="media/giftrav-hero.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>
  </div>

  <main id="content">
    <div class="lede">
      <p class="kicker">Coming soon</p>

      <h1 class="display">
        Where Every Gift<span class="brk"><br></span>
        Becomes a <span class="accent">Memory</span>
      </h1>

      <p class="sub">Launching across Australia, late 2026.</p>
    </div>
  </main>

  <footer>
    <span>Giftrav</span>

    <div class="socials">
      <a href="https://www.instagram.com/giftrav.experiences/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.facebook.com/profile.php?id=61578663041155" target="_blank" rel="noopener">Facebook</a>

      <button class="motion-toggle" type="button" aria-pressed="false"
              aria-label="Pause background video" title="Pause background video">
        <svg class="i-pause" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="0" width="3.6" height="12" rx="0.6"/><rect x="7.4" y="0" width="3.6" height="12" rx="0.6"/></svg>
        <svg class="i-play"  viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 0.4 11 6 1.5 11.6Z"/></svg>
      </button>
    </div>
  </footer>

</div>

<script>
(function () {
  var video  = document.querySelector('.bgvideo');
  var toggle = document.querySelector('.motion-toggle');
  if (!video || !toggle) return;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  function setPaused(paused) {
    toggle.setAttribute('aria-pressed', paused ? 'true' : 'false');
    var label = paused ? 'Play background video' : 'Pause background video';
    toggle.setAttribute('aria-label', label);
    toggle.setAttribute('title', label);
  }

  // Honour the OS setting on load: no autoplay, poster carries the page.
  function applyReducedMotion() {
    if (reduce.matches) {
      video.removeAttribute('autoplay');
      video.pause();
      setPaused(true);
    }
  }
  applyReducedMotion();
  if (reduce.addEventListener) reduce.addEventListener('change', applyReducedMotion);

  toggle.addEventListener('click', function () {
    if (video.paused) {
      video.play().then(function () { setPaused(false); })
                  .catch(function () { setPaused(true); });
    } else {
      video.pause();
      setPaused(true);
    }
  });

  // Reflect state if the browser pauses on its own (data saver, low power
  // mode, background tab). We report what happened — we do not override it.
  video.addEventListener('play',  function () { setPaused(false); });
  video.addEventListener('pause', function () { setPaused(true);  });

  // If the media fails outright, get the element out of the way so the
  // browser does not paint its broken-media control bar over the footer.
  // The poster is also the .media background, so the page still holds up.
  video.addEventListener('error', function () {
    video.style.display = 'none';
    toggle.style.display = 'none';
  }, true);

  // If autoplay is refused outright, leave the poster up and show "play".
  // Skipped entirely under reduced motion — otherwise this would restart
  // the very playback applyReducedMotion() just stopped.
  if (!reduce.matches) {
    var attempt = video.play();
    if (attempt && attempt.catch) attempt.catch(function () { setPaused(true); });
  }
})();
</script>

</body>
</html>
