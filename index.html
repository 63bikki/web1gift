  <script>
    (function () {
      function keepAlive() {
        var v = document.querySelector('.bgvideo');
        if (!v) return;
        var tryPlay = function () { v.play().catch(function () {}); };
        v.addEventListener('pause', tryPlay);
        v.addEventListener('ended', tryPlay);
        v.addEventListener('stalled', tryPlay);
        v.addEventListener('waiting', tryPlay);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) tryPlay();
        });
        tryPlay();
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', keepAlive);
      } else {
        keepAlive();
      }
    })();
  </script>
